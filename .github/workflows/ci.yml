name: Controller CI

on:
  push:
    branches: [main, safefork-controller]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controller-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python deploy/audit_history.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/test_ui.js
        env:
          TZ: UTC
      - run: node --test tests/test_ui.js
        env:
          TZ: Asia/Shanghai

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --pull --label org.opencontainers.image.revision=${{ github.sha }} -t forkiq-safefork-controller:${{ github.sha }} .
      - run: python3 deploy/container_smoke.py --image forkiq-safefork-controller:${{ github.sha }} --memory-mib 128 --report dist/image/smoke.json
      - name: Check runtime image contents
        run: |
          docker run --rm --entrypoint python forkiq-safefork-controller:${{ github.sha }} -c 'from pathlib import Path; p=Path("/opt/forkiq"); forbidden={".pem",".key",".db",".sqlite",".bundle",".pyc"}; assert not any(f.suffix in forbidden or f.name.startswith(".env") for f in p.rglob("*") if f.is_file()); assert not (p/".git").exists(); assert not (p/"app/restore.py").exists(); print("PASS: no runtime secrets, database, Git metadata or rollback module in application image")'
      - name: Export verified image
        if: github.event_name != 'pull_request'
        run: |
          docker save forkiq-safefork-controller:${{ github.sha }} | gzip -1 > dist/image/controller-image.tar.gz
          docker image inspect forkiq-safefork-controller:${{ github.sha }} > dist/image/image.json
          cd dist/image
          sha256sum controller-image.tar.gz image.json smoke.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: controller-image-${{ github.sha }}
          path: dist/image/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
