name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package and release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          TZ=UTC node --test tests/test_ui.js
          TZ=Asia/Shanghai node --test tests/test_ui.js
      - name: Build deployment packages
        run: python deploy/package.py "$RELEASE_TAG"
      - name: Verify package checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "dist/forkiq-$RELEASE_TAG.tar.gz" \
            "dist/forkiq-$RELEASE_TAG.zip" \
            dist/SHA256SUMS \
            --verify-tag --title "ForkIQ $RELEASE_TAG" --generate-notes \
            --notes "部署包附 SHA256SUMS 校验文件；release.json 记录版本、提交及文件校验值。不含数据库、App 私钥或本地配置。" \
            "${flags[@]}"
